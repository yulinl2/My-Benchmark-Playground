name: Deploy demo to GitHub Pages

# Serves mac-dotfiles-yulin/demo/ as the site root:
#   https://yulinl2.github.io/My-Benchmark-Playground/
on:
  push:
    branches: [main]
    paths:
      - "mac-dotfiles-yulin/demo/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Allow the GITHUB_TOKEN to deploy to Pages (and auto-enable it the first time)
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-progress run finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload demo as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: mac-dotfiles-yulin/demo

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
