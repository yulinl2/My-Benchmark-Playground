name: Build & publish audit console (gh-pages branch)

# Builds app/ and publishes the static bundle to a `gh-pages` branch using
# GITHUB_TOKEN. This avoids the `github-pages` deployment ENVIRONMENT gate (which
# only permits the default branch), so it runs green from this feature branch.
#
# To make it live (one-time): repo Settings -> Pages -> Build and deployment ->
# Source = "Deploy from a branch" -> Branch = gh-pages / (root) -> Save.
# The site is noindex + crawler-blocked (app/index.html meta + robots.txt).
# Reversible: delete this file (and the gh-pages branch) or set Pages off.

on:
  push:
    branches: [claude/long-context-task-distribution-2iydu1]
    paths:
      - 'app/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-ghbranch
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        working-directory: app
        run: npm ci
      - name: Build
        working-directory: app
        run: npm run build
      - name: Disable Jekyll processing
        run: touch app/dist/.nojekyll
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: app/dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "deploy: audit console ${{ github.sha }}"
