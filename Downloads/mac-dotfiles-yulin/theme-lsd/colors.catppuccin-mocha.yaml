# Catppuccin Mocha theme for lsd
# Palette ref: https://github.com/catppuccin/catppuccin
#
# Base layers:
#   crust:     #11111b   (deepest bg)
#   mantle:    #181825
#   base:      #1e1e2e   (terminal bg)
#   surface0:  #313244
#   surface1:  #45475a
#   surface2:  #585b70
#
# Text:
#   overlay0:  #6c7086   (muted)
#   overlay1:  #7f849c
#   overlay2:  #9399b2
#   subtext0:  #a6adc8
#   subtext1:  #bac2de
#   text:      #cdd6f4   (fg)
#
# Accents:
#   rosewater: #f5e0dc
#   flamingo:  #f2cdcd
#   pink:      #f5c2e7
#   mauve:     #cba6f7
#   red:       #f38ba8
#   maroon:    #eba0ac
#   peach:     #fab387
#   yellow:    #f9e2af
#   green:     #a6e3a1
#   teal:      #94e2d5
#   sky:       #89dceb
#   sapphire:  #74c7ec
#   blue:      #89b4fa
#   lavender:  #b4befe

when: auto

user: "#89b4fa"      # blue
group: "#94e2d5"     # teal

permission:
  read: "#a6e3a1"          # green
  write: "#f9e2af"         # yellow
  exec: "#f38ba8"          # red
  exec-sticky: "#fab387"   # peach
  no-access: "#6c7086"     # overlay0
  octal: "#cba6f7"         # mauve
  acl: "#94e2d5"           # teal
  context: "#94e2d5"       # teal

date:
  hour-old: "#94e2d5"      # teal — freshest
  day-old: "#89b4fa"       # blue
  older: "#6c7086"         # overlay0

size:
  none: "#6c7086"          # overlay0
  small: "#a6e3a1"         # green
  medium: "#f9e2af"        # yellow
  large: "#f38ba8"         # red

inode:
  valid: "#cba6f7"         # mauve
  invalid: "#6c7086"       # overlay0

links:
  valid: "#a6e3a1"         # green
  invalid: "#f38ba8"       # red

tree-edge: "#585b70"       # surface2

git-status:
  default: "#6c7086"       # overlay0
  unmodified: "#6c7086"    # overlay0
  ignored: "#45475a"       # surface1
  new-in-index: "#a6e3a1"  # green
  new-in-workdir: "#94e2d5" # teal
  typechange: "#f9e2af"    # yellow
  deleted: "#f38ba8"       # red
  renamed: "#89b4fa"       # blue
  modified: "#f9e2af"      # yellow
  conflicted: "#f38ba8"    # red
